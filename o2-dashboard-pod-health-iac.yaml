apiVersion: batch/v1
kind: Job
metadata:
  name: provision-o2-dashboard-pod-health
  namespace: openobserve
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: curl-provisioner
          image: curlimages/curl:8.10.1
          env:
            - name: O2_AUTH
              valueFrom:
                secretKeyRef:
                  name: o2-auth
                  key: auth
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              BASE="http://openobserve-standalone.openobserve.svc.cluster.local:5080"
              API="${BASE}/api/default"
              DASH_TITLE="K3s Pod & Workload Health (IaC)"

              echo "Waiting for OpenObserve API..."
              i=0
              until curl -sf -o /dev/null "$BASE/healthz"; do
                i=$((i+1))
                if [ "$i" -gt 100 ]; then
                  echo "ERROR: OpenObserve API unreachable"
                  exit 1
                fi
                sleep 3
              done

              # Upsert loop: look up server-assigned id by unique title, PUT if exists, else POST.
              # Retries to ride out transient OpenObserve auth/validation hiccups.
              ATTEMPT=0
              while true; do
                ATTEMPT=$((ATTEMPT+1))
                LIST=$(curl -s -u "$O2_AUTH" "$API/dashboards")
                ITEM=$(echo "$LIST" | tr '{' '\n' | grep "\"dashboard_id\":\"[^\"]*\",\"title\":\"$DASH_TITLE\"" | head -n1)
                EXISTING_ID=$(echo "$ITEM" | sed 's/.*"dashboard_id":"\([^"]*\)".*/\1/')
                EXISTING_HASH=$(echo "$ITEM" | sed 's/.*"hash":"\([^"]*\)".*/\1/')

                if [ -n "$EXISTING_ID" ]; then
                  echo "Dashboard '$DASH_TITLE' exists (id $EXISTING_ID) - updating"
                  METHOD="PUT"
                  URL="$API/dashboards/$EXISTING_ID?hash=$EXISTING_HASH"
                else
                  echo "Dashboard '$DASH_TITLE' not found - creating"
                  METHOD="POST"
                  URL="$API/dashboards"
                fi

                CODE=$(curl -s -o /tmp/o2-resp.json -w '%{http_code}' \
                  -X "$METHOD" \
                  -u "$O2_AUTH" \
                  -H "Content-Type: application/json" \
                  -d @/config/dashboard.json \
                  "$URL")

                echo "HTTP $CODE"
                if [ "$CODE" = "200" ] || [ "$CODE" = "201" ]; then
                  cat /tmp/o2-resp.json
                  echo ""
                  echo "Dashboard provisioning succeeded: $DASH_TITLE"
                  exit 0
                fi
                cat /tmp/o2-resp.json
                echo ""
                if [ "$ATTEMPT" -ge 5 ]; then
                  echo "ERROR: dashboard provisioning failed after $ATTEMPT attempts (last HTTP $CODE)"
                  exit 1
                fi
                echo "Retrying in 5s..."
                sleep 5
              done
          volumeMounts:
            - name: dashboard-vol
          volumeMounts:
            - name: dashboard-vol
              mountPath: /config
      volumes:
        - name: dashboard-vol
          configMap:
            name: o2-dashboard-pod-health-json
