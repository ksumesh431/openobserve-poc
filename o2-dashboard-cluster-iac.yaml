# IaC: K3s Cluster Overview dashboard for OpenObserve (self-contained: Secret + ConfigMap + provisioning Job)
apiVersion: v1
kind: Secret
metadata:
  name: o2-auth
  namespace: openobserve
type: Opaque
stringData:
  auth: "admin@local.dev:ComplexPassword123!" # user:pass; curl -u base64-encodes this
---
