apiVersion: v1
kind: Namespace
metadata:
  name: openobserve
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: openobserve-standalone
  namespace: kube-system # K3s helm-controller watches kube-system by default
spec:
  repo: https://charts.openobserve.ai
  chart: openobserve-standalone
  targetNamespace: openobserve
  valuesContent: |-
    auth:
      ZO_ROOT_USER_EMAIL: "admin@local.dev"
      ZO_ROOT_USER_PASSWORD: "ComplexPassword123!"
    config:
      ZO_DATA_DIR: "/data"
      ZO_TELEMETRY: "false"
      ZO_COMPACT_DATA_RETENTION_DAYS: "7"
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: local-path
    ingress:
      enabled: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openobserve-ui
  namespace: openobserve
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: o2.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openobserve-standalone
                port:
                  number: 5080