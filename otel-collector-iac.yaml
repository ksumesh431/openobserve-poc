apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: k3s-telemetry-agent
  namespace: kube-system
spec:
  repo: https://open-telemetry.github.io/opentelemetry-helm-charts
  chart: opentelemetry-collector
  targetNamespace: openobserve
  valuesContent: |-
    mode: daemonset
    rewriteDeprecatedComponentNames: false
    image:
      repository: otel/opentelemetry-collector-contrib
    presets:
      logsCollection:
        enabled: true
        includeCollectorLogs: false
      hostMetrics:
        enabled: true
      kubeletMetrics:
        enabled: true
      kubernetesAttributes:
        enabled: true
        extractAllPodLabels: true
    config:
      receivers:
        hostmetrics:
          root_path: /hostfs
          collection_interval: 15s
          scrapers:
            cpu: {}
            disk: {}
            filesystem:
              exclude_mount_points:
                mount_points:
                  - /dev/*
                  - /proc/*
                  - /sys/*
                  - /run/k3s/containerd/*
                  - /var/lib/docker/*
                  - /var/lib/kubelet/*
                  - /snap/*
                match_type: regexp
              exclude_fs_types:
                fs_types:
                  - autofs
                  - binfmt_misc
                  - bpf
                  - cgroup2
                  - configfs
                  - debugfs
                  - devpts
                  - devtmpfs
                  - fusectl
                  - hugetlbfs
                  - iso9660
                  - mqueue
                  - nsfs
                  - overlay
                  - proc
                  - procfs
                  - pstore
                  - rpc_pipefs
                  - securityfs
                  - selinuxfs
                  - squashfs
                  - sysfs
                  - tracefs
                match_type: strict
            load: {}
            memory: {}
            network: {}
            paging: {}
            system:
              metrics:
                system.uptime:
                  enabled: true
        kubeletstats:
          collection_interval: 15s
          auth_type: "serviceAccount"
          endpoint: "https://${env:K8S_NODE_NAME}:10250"
          insecure_skip_verify: true
          metric_groups:
            - node
            - pod
            - container
          metrics:
            k8s.node.uptime:
              enabled: true
            k8s.pod.uptime:
              enabled: true
            container.uptime:
              enabled: true
      exporters:
        otlphttp/openobserve:
          endpoint: "http://openobserve-standalone.openobserve.svc.cluster.local:5080/api/default"
          headers:
            Authorization: "Basic YWRtaW5AbG9jYWwuZGV2OkNvbXBsZXhQYXNzd29yZDEyMyE="
            stream-name: "k3s_logs"
      service:
        pipelines:
          logs:
            exporters:
              - otlphttp/openobserve
          metrics:
            exporters:
              - otlphttp/openobserve